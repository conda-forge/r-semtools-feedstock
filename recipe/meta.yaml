{% set version = "0.5-10" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-semtools
  version: {{ version|replace('-', '_') }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/semTools_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/semTools/semTools_{{ version }}.tar.gz
  sha256: 338ec536c76d0f084089f54fe71362c28786a94868d538741c84a3ede2e247ad

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-lavaan >=0.6_21
    - r-pbivnorm
  run:
    - r-base
    - r-lavaan >=0.6_21
    - r-pbivnorm

test:
  commands:
    - $R -e "library('semTools')"           # [not win]
    - "\"%R%\" -e \"library('semTools')\""  # [win]

about:
  home: https://github.com/simsem/semTools/wiki
  license: GPL-2.0-or-later
  summary: Provides miscellaneous tools for structural equation modeling, many of which extend the 'lavaan' package. For example, latent interactions can be estimated using product indicators (Lin et al., 2010, <doi:10.1080/10705511.2010.488999>) and simple effects probed; analytical power analyses can be conducted 
    (Jak et al., 2021, <doi:10.3758/s13428-020-01479-0>); and scale reliability can be estimated based on estimated factor-model parameters.
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
